<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Moderación | Argentina Is Here</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="moderationPage">

    <div id="loginContainer">

      <h1>MODERACIÓN</h1>

      <p class="moderation-intro">
        Acceso privado
      </p>

      <form id="loginForm">

        <input
          type="email"
          id="email"
          placeholder="Email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          required
        >

        <button type="submit">
          INICIAR SESIÓN
        </button>

        <p id="loginStatus"></p>

      </form>

    </div>


    <div id="moderationContainer" class="hidden">

      <h1>MENSAJES PENDIENTES</h1>

      <button id="logoutButton">
        CERRAR SESIÓN
      </button>

      <div id="pendingMessages">
        Cargando mensajes...
      </div>

    </div>

  </main>

  <script src="moderacion.js"></script>

</body>

</html>
